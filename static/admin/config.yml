backend:
  name: git-gateway
  branch: main
  squash_merges: true
publish_mode: editorial_workflow
local_backend: true

media_folder: "assets/media"
public_folder: "/media"

collections:
  - name: "content"
    label: "Sisältö"
    folder: "content/content"
    create: true
    slug: "{{slug}}"
    # Show content type in the Sisältö collection listing
    summary: "{{fields.content_type}} — {{title}}"
    sortable_fields: ["commit_date", "title", "content_type"]
    view_filters:
      - label: Tuotteet
        field: content_type
        pattern: Tuote
      - label: Referenssit
        field: content_type
        pattern: Referenssi
      - label: Kampanjat
        field: content_type
        pattern: Kampanja
      - label: Sivut
        field: content_type
        pattern: Sivu
    view_groups:
      - label: Sisältötyyppi
        field: content_type
    fields:
      - label: "Sisältötyyppi"
        name: "content_type"
        widget: "select"
        options:
          - { label: "Tuote", value: "Tuote" }
          - { label: "Referenssi", value: "Referenssi" }
          - { label: "Sivu", value: "Sivu" }
          - { label: "Kampanja", value: "Kampanja" }
        default: "Sivu"
      - label: "Sivupohja"
        name: "page_template"
        widget: "select"
        options:
          - { label: "Oletus (tuote → tuotesivu, muut → yksinkertainen)", value: "default" }
          - { label: "Tuotesivu", value: "product" }
          - { label: "Yksinkertainen", value: "simple" }
        default: "default"
        hint: "Oletus: tuotteet käyttävät tuotesivua, muut yksinkertaista artikkeliasettelua."

      # Common fields (once for all types)
      - label: "Otsikko"
        name: "title"
        widget: "string"
      - label: "Osoite (URL)"
        name: "url"
        widget: "string"
        required: false
        hint: "Täyttyy automaattisesti tallennettaessa: /tuotteet/slug/, /referenssit/slug/, /kampanjat/slug/ tai /sivut/slug/. Voit yliajaa käsin."
      - label: "Kuvaus"
        name: "description"
        widget: "text"
        required: false
      - label: "Nosta etusivulle"
        name: "featureInFrontpage"
        widget: "boolean"
        default: false
        required: false
      - label: "Näytä valikossa"
        name: "showInMenu"
        widget: "boolean"
        default: false
        required: false
      - label: "Näytä alatunnisteessa"
        name: "showInFooter"
        widget: "boolean"
        default: false
        required: false
      - label: "Näytä yhteystietolomake"
        name: "showContactForm"
        widget: "boolean"
        default: false
        required: false
      - label: "Näytä kaikki henkilöt"
        name: "showPeople"
        widget: "boolean"
        default: false
        required: false
        hint: "Näyttää kaikki henkilöt sivun lopussa. Ei tarvita, jos valitset henkilöt alla."
      - label: "Henkilöt tällä sivulla"
        name: "people"
        widget: "relation"
        collection: "people"
        searchFields: ["title", "role"]
        valueField: "{{slug}}"
        displayFields: ["title", "role"]
        multiple: true
        required: false
        hint: "Valitse yksi tai useampi henkilö — he näkyvät sivun lopussa. Tyhjä + 'Näytä kaikki henkilöt' = koko tiimi. Tallennetaan slugina, joten nimen vaihto ei katkaise linkitystä."
      - label: "Näytä kaikki valmistajat"
        name: "showManufacturers"
        widget: "boolean"
        default: false
        required: false
        hint: "Näyttää kaikki valmistajat sivun lopussa. Ei tarvita, jos valitset valmistajat alla."
      - label: "Valmistajat tällä sivulla"
        name: "manufacturers"
        widget: "relation"
        collection: "manufacturers"
        searchFields: ["title"]
        valueField: "{{slug}}"
        displayFields: ["title"]
        multiple: true
        required: false
        hint: "Valitse yksi tai useampi valmistaja. Tyhjä + 'Näytä kaikki valmistajat' = kaikki merkit. Tallennetaan slugina, joten nimen vaihto ei katkaise linkitystä."
      - label: "Valmistajat-osion otsikko"
        name: "manufacturersTitle"
        widget: "string"
        required: false
        hint: "Tyhjä = ei otsikkoa logojen yläpuolella."
      - label: "Näytä valmistajan nimi logon yllä"
        name: "showManufacturerTitles"
        widget: "boolean"
        default: false
        required: false
      - label: "Nosto kuva (teaser)"
        name: "teaserImage"
        widget: "image"
        required: false
      - label: "Kuvat (pääkuvat / galleria)"
        name: "mainImages"
        widget: "list"
        required: false
        fields:
          - label: "Kuva"
            name: "image"
            widget: "image"
          - label: "Kuvateksti (caption, käytä referensseissä)"
            name: "caption"
            widget: "string"
            required: false
      - label: "Sisältö"
        name: "body"
        widget: "markdown"
        required: false

      # Core field for linking to manufacturer
      - label: "Valmistaja"
        name: "manufacturer"
        widget: "relation"
        collection: "manufacturers"
        searchFields: ["title"]
        valueField: "{{slug}}"
        displayFields: ["title"]
        required: false
        hint: "Tallennetaan slugina. Nimen vaihto CMS:ssä ei katkaise tuotteen valmistajalinkkiä."

      # Product specific (optional)
      - label: "Hinta (vain tuotteet)"
        name: "price"
        widget: "string"
        required: false
      - label: "Tärkeimmät ominaisuudet (vain tuotteet)"
        name: "features"
        widget: "list"
        required: false
        field:
          label: "Ominaisuus"
          name: "feature"
          widget: "string"
      - label: "Lisätietolinkki (vain tuotteet)"
        name: "moreInfoLink"
        widget: "string"
        required: false

      # Reference specific (optional)
      - label: "Käytetty tuote (vain referenssit)"
        name: "usedProduct"
        widget: "relation"
        collection: "content"
        searchFields: ["title"]
        valueField: "{{slug}}"
        displayFields: ["title"]
        required: false
        hint: "Tallennetaan slugina. Tuotteen nimen vaihto ei katkaise referenssin linkkiä."

  # Asetukset (site-wide and frontpage settings)
  - name: "frontpage"
    label: "Asetukset"
    files:
      - label: "Etusivun asetukset"
        name: "frontpage"
        file: "data/frontpage.yaml"
        fields:
          - label: "Tervetuloa"
            name: "welcome"
            widget: "object"
            collapsed: false
            fields:
              - label: "Näytä etusivulla"
                name: "enabled"
                widget: "boolean"
                default: true
              - label: "Järjestys"
                name: "order"
                widget: "number"
                value_type: "int"
                default: 0
              - label: "Näytä osion otsikko"
                name: "showHeading"
                widget: "boolean"
                default: true
                hint: "Jos pois päältä, osion otsikkoa ei näytetä etusivulla."
              - label: "Otsikko"
                name: "title"
                widget: "string"
                default: "Tervetuloa"
                required: false
              - label: "Sisältö"
                name: "content"
                widget: "markdown"
                required: false
              - label: "Kuva"
                name: "image"
                widget: "image"
                required: false
                hint: "Jos kuva on lisätty, osio näytetään kahdessa sarakkeessa työpöydällä (teksti + kuva). Pienellä näytöllä otsikko ja teksti tulevat ensin, kuva sen jälkeen."
              - label: "Toimintakehotteet (CTA)"
                name: "ctas"
                widget: "list"
                required: false
                hint: "Voit lisätä useita. Linkillä näytetään painike, ilman linkkiä pelkkä teksti."
                summary: "{{fields.label}}"
                fields:
                  - label: "Teksti"
                    name: "label"
                    widget: "string"
                  - label: "Linkki"
                    name: "url"
                    widget: "string"
                    required: false
                    hint: "Tyhjä = pelkkä teksti. Polku (/tuotteet/), ankkuri (#osio-yhteystiedot), tel:/mailto: tai ulkoinen osoite."
          - label: "Tietoa meistä"
            name: "about"
            widget: "object"
            collapsed: false
            fields:
              - label: "Näytä etusivulla"
                name: "enabled"
                widget: "boolean"
                default: true
              - label: "Järjestys"
                name: "order"
                widget: "number"
                value_type: "int"
                default: 40
              - label: "Näytä osion otsikko"
                name: "showHeading"
                widget: "boolean"
                default: true
                hint: "Jos pois päältä, osion otsikkoa ei näytetä etusivulla."
              - label: "Otsikko"
                name: "title"
                widget: "string"
                default: "Tietoa meistä"
                required: false
              - label: "Sisältö"
                name: "content"
                widget: "markdown"
                required: false
                hint: "Landing page -osio ilman alisivuja."
              - label: "Toimintakehotteet (CTA)"
                name: "ctas"
                widget: "list"
                required: false
