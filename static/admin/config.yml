                multiple: true
                required: false
                hint: "Tyhjä = näytä kaikki valmistajat. Tallennetaan slugina."
              - label: "Toimintakehotteet (CTA)"
                name: "ctas"
                widget: "list"
                required: false
                hint: "Voit lisätä useita. Linkillä näytetään painike, ilman linkkiä pelkkä teksti."
                summary: "{{fields.label}}"
                fields:
                  - label: "Teksti"
                    name: "label"
                    widget: "string"
                  - label: "Linkki"
                    name: "url"
                    widget: "string"
                    required: false
                    hint: "Tyhjä = pelkkä teksti. Polku (/tuotteet/), ankkuri (#osio-yhteystiedot), tel:/mailto: tai ulkoinen osoite."
          - label: "Yhteystietolomake"
            name: "contactForm"
            widget: "object"
            collapsed: true
            fields:
              - label: "Näytä etusivulla"
                name: "enabled"
                widget: "boolean"
                default: false
              - label: "Järjestys"
                name: "order"
                widget: "number"
                value_type: "int"
                default: 50
              - label: "Näytä osion otsikko"
                name: "showHeading"
                widget: "boolean"
                default: true
                hint: "Jos pois päältä, osion otsikkoa ei näytetä etusivulla."
              - label: "Otsikko"
                name: "title"
                widget: "string"
                default: "Ota yhteyttä"
                required: false
              - label: "Osion sisältö"
                name: "content"
                widget: "markdown"
                required: false
                hint: "Näytetään lomakkeen otsikon alla."
              - label: "Toimintakehotteet (CTA)"
                name: "ctas"
                widget: "list"
                required: false
                hint: "Voit lisätä useita. Linkillä näytetään painike, ilman linkkiä pelkkä teksti."
                summary: "{{fields.label}}"
                fields:
                  - label: "Teksti"
                    name: "label"
                    widget: "string"
                  - label: "Linkki"
                    name: "url"
                    widget: "string"
                    required: false
                    hint: "Tyhjä = pelkkä teksti. Polku (/tuotteet/), ankkuri (#osio-yhteystiedot), tel:/mailto: tai ulkoinen osoite."

      - label: "Tietosuoja ja evästeet"
        name: "consent"
        file: "data/consent.yaml"
        fields:
          - label: "Bannerin otsikko"
            name: "bannerTitle"
            widget: "string"
            default: "Evästeet"
          - label: "Bannerin teksti"
            name: "bannerText"
            widget: "text"
          - label: "Lisäteksti tietosuojasivulle"
            name: "extraContent"
            widget: "markdown"
            required: false
            hint: "Liitetään automaattisesti generoidun tietosuojaselosteen loppuun."
          - label: "Suostumusta edellyttävät järjestelmät"
            name: "systems"
            widget: "list"
            summary: "{{fields.name}} ({{fields.type}})"
            hint: "Lisää tähän GA4, tag manager, pikselit ym. Tietosuojasivu ja evästebanneri päivittyvät automaattisesti."
            fields:
              - label: "Tunniste (id)"
                name: "id"
                widget: "string"
                hint: "Pysyvä tekninen id, esim. ga4 tai meta-pixel. Älä vaihda myöhemmin."
              - label: "Nimi"
                name: "name"
                widget: "string"
              - label: "Tarkoitus"
                name: "purpose"
                widget: "text"
                required: false
              - label: "Toimittaja"
                name: "provider"
                widget: "string"
                required: false
              - label: "Luokka"
                name: "category"
                widget: "select"
                options:
                  - { label: "Välttämätön", value: "necessary" }
                  - { label: "Analytiikka", value: "analytics" }
                  - { label: "Markkinointi", value: "marketing" }
                  - { label: "Toiminnallinen", value: "functional" }
                default: "analytics"
              - label: "Pakollinen"
                name: "required"
                widget: "boolean"
                default: false
              - label: "Näytä evästebannerissa"
                name: "inBanner"
                widget: "boolean"
                default: true
                hint: "Pois päältä = vain tietosuojaseloste (esim. Netlify Forms). Lomaketta ei saa kytkeä evästevalintaan."
              - label: "Käytössä"
                name: "enabled"
                widget: "boolean"
                default: true
              - label: "Lataustyyppi"
                name: "type"
                widget: "select"
                options:
                  - { label: "Ei skriptiä (vain seloste)", value: "none" }
                  - { label: "Google Analytics 4", value: "ga4" }
                  - { label: "Google Tag Manager", value: "gtm" }
                  - { label: "Ulkoinen skripti", value: "script" }
                default: "none"
              - label: "Mittaus- tai säiliötunnus"
                name: "measurementId"
                widget: "string"
                required: false
                hint: "GA4: G-XXXXXXXXXX. GTM: GTM-XXXX."
              - label: "Skriptin osoite"
                name: "scriptSrc"
                widget: "string"
                required: false
                hint: "Vain tyypille 'Ulkoinen skripti'."
              - label: "Evästeet"
                name: "cookies"
                widget: "string"
                required: false
              - label: "Toimittajan tietosuojalinkki"
                name: "privacyUrl"
                widget: "string"
                required: false
      - label: "Sivuston asetukset"
        name: "site"
        file: "data/site.yaml"
        fields:
          - label: "Favicon"
            name: "favicon"
            widget: "image"
            required: false
          - label: "Pieni logo (ylätunniste)"
            name: "logo_small"
            widget: "image"
            required: false
            hint: "Näkyy vain sivun yläpalkissa."
          - label: "Suuri logo (alatunniste)"
            name: "logo_large"
            widget: "image"
            required: false
            hint: "Näkyy vain sivun alatunnisteessa."
          - label: "Ylätunnisteen teksti"
            name: "header_text"
            widget: "string"
            required: false
            hint: "Lyhyt teksti logon vieressä. Rivittyy enintään kahdelle riville, sanoja ei katkaista."
          - label: "Näytä teksti ylätunnisteessa"
            name: "show_header_text"
            widget: "boolean"
            default: false
            hint: "Jos pois päältä, ylätunnisteen tekstiä ei näytetä."
          - label: "Sivuston kuvaus"
            name: "description"
            widget: "text"
            required: false
          - label: "Meta / SEO"
            name: "meta"
            widget: "object"
            collapsed: true
            fields:
              - label: "OG Kuva (someen)"
                name: "og_image"
                widget: "image"
                required: false
              - label: "Twitter / X käyttäjä"
                name: "twitter"
                widget: "string"
                required: false
          - label: "Analytiikka"
            name: "analytics"
            widget: "object"
            collapsed: true
            fields:
              - label: "Google Analytics 4 -tunnus (varatunnus)"
                name: "google"
                widget: "string"
                required: false
                hint: "Käytetään jos Tietosuoja ja evästeet -osion GA4-järjestelmältä puuttuu tunnus. Seuranta ladataan vasta evästesuostumuksen jälkeen."
          - label: "Teemavärit"
            name: "theme"
            widget: "object"
            collapsed: false
            hint: "Nämä värit vaikuttavat koko sivustoon. Riittää yleensä tausta, teksti, korostus ja reunat."
            fields:
              - label: "Sivun tausta"
                name: "bg_color"
                widget: "color"
                allowInput: true
                default: "#f3efe6"
                hint: "Koko sivun tausta."
              - label: "Pinta (kortit / lohkot)"
                name: "surface_color"
                widget: "color"
                allowInput: true
                default: "#fffcf6"
                hint: "Kortit, lomakkeet, henkilökortit."
              - label: "Teksti"
                name: "primary_color"
                widget: "color"
                allowInput: true
                default: "#1c2a24"
                hint: "Otsikot ja leipäteksti."
              - label: "Hillitty teksti"
                name: "muted_color"
                widget: "color"
                allowInput: true
                default: "#5d6b64"
                hint: "Kuvaukset, tittelit, alatunnisteen pieni teksti."
              - label: "Korostus (painikkeet, linkit)"
                name: "accent_color"
                widget: "color"
                allowInput: true
                default: "#0d6e5c"
                hint: "CTA-painikkeet, linkit, aktiiviset tilat."
              - label: "Teksti korostuksen päällä"
                name: "accent_text_color"
                widget: "color"
                allowInput: true
                default: "#ffffff"
                hint: "Teksti accent-painikkeen päällä. Yleensä valkoinen."
              - label: "Reunat"
                name: "border_color"
                widget: "color"
                allowInput: true
                default: "#d8d0c4"
                hint: "Viivat, korttien reunat, lomakekentät."
              - label: "Ylätunnisteen tausta"
                name: "header_bg"
                widget: "color"
                allowInput: true
                default: "#fffcf6"
              - label: "Alatunnisteen tausta"
                name: "footer_bg"
                widget: "color"
                allowInput: true
                default: "#e7e0d4"
          - label: "Yhteystiedot"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - label: "Yrityksen nimi"
                name: "company_name"
                widget: "string"
                required: false
                hint: "Näkyy alatunnisteen yhteystiedoissa ylimpänä."
              - label: "Sähköposti"
                name: "email"
                widget: "string"
                required: false
              - label: "Puhelin"
                name: "phone"
                widget: "string"
                required: false
              - label: "Osoite"
                name: "address"
                widget: "text"
                required: false
          - label: "Valikko / Päänavigaatio"
            name: "menu"
            widget: "object"
            collapsed: true
            fields:
              - label: "Näytä Tuotteet"
                name: "products"
                widget: "boolean"
                default: true
              - label: "Näytä Referenssit"
                name: "references"
                widget: "boolean"
                default: true
              - label: "Näytä Sivut"
                name: "pages"
                widget: "boolean"
                default: true
              - label: "Näytä Kampanjat"
                name: "kampanjat"
                widget: "boolean"
                default: true
          - label: "Sosiaalinen media"
            name: "social"
            widget: "object"
            collapsed: true
            fields:
              - label: "Facebook"
                name: "facebook"
                widget: "string"
                required: false
              - label: "X (Twitter)"
                name: "x"
                widget: "string"
                required: false
              - label: "Instagram"
                name: "instagram"
                widget: "string"
                required: false
              - label: "YouTube"
                name: "youtube"
                widget: "string"
                required: false

  - name: "people"
    label: "Henkilöt"
    folder: "content/people"
